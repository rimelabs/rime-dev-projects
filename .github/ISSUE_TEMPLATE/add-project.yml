name: Add or update a project
description: Propose a project, integration, best practice, or tool for the voice AI catalog.
title: "[Project]: "
labels:
  - project-submission
body:
  - type: input
    id: event
    attributes:
      label: Developer event (if applicable)
      description: Leave this blank if the project was built independently.
      placeholder: Event name and year
  - type: input
    id: project
    attributes:
      label: Project name
    validations:
      required: true
  - type: dropdown
    id: project_type
    attributes:
      label: Project type
      options:
        - Application
        - Integration
        - Adapter
        - Evaluation resource
        - Developer tool
        - Reference example
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Public source repository
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Brief executive summary
      description: In one or two sentences, explain what the project does, how it uses voice, and why the work is useful.
    validations:
      required: true
  - type: input
    id: article
    attributes:
      label: Article or technical write-up
      description: Optional. A repository README is acceptable.
  - type: input
    id: live_demo
    attributes:
      label: Live demo
      description: Optional. A publicly accessible experience people can try.
  - type: input
    id: demo
    attributes:
      label: Demo video
      description: Optional. YouTube, Loom, or a publicly viewable recording.
  - type: textarea
    id: team
    attributes:
      label: Team members
      description: List each member’s name and LinkedIn URL. Add a GitHub URL when LinkedIn is unavailable.
    validations:
      required: true
  - type: textarea
    id: voice
    attributes:
      label: How the project uses voice
      description: Point to the primary voice flow, integration, or relevant source files. Include the Rime implementation if the project uses Rime.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Publication checks
      options:
        - label: Voice is a meaningful part of the project, or the work is directly useful to voice AI developers.
          required: true
        - label: The linked repository does not contain live credentials or private data.
          required: true
        - label: The builders consent to publishing the submitted names and profile links.
          required: true
